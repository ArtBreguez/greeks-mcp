[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "greeks-mcp"
version = "0.1.0"
description = "MCP server exposing the Greeks / Aetherfy options-analytics API as tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aetherfy" }]
keywords = ["mcp", "options", "greeks", "gex", "trading", "analytics", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://greeks.pro"
Documentation = "https://greeks.pro/docs"

[project.scripts]
greeks-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
