[project]
name = "greeks-mcp"
version = "0.1.0"
description = "MCP server exposing the Greeks / Aetherfy options-analytics API as tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
greeks-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
